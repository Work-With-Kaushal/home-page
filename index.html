<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aviator X — Enhanced (Final)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070708;
    --panel:#0f0f12;
    --muted:#9aa0a6;
    --red:#e53b3b;
    --soft-gray:#2a2a2d;
    --glass: rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Poppins',system-ui,Segoe UI,Roboto,Helvetica,Arial;
    background:
      radial-gradient(circle at 10% 10%, rgba(50, 49, 49, 0.921), transparent 12%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.01), transparent 12%),
      var(--bg);
    color:#f6f6f6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-bottom:48px;
  }

  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:linear-gradient(180deg, rgba(91, 7, 7, 0.775), transparent);
    border-bottom:1px solid rgba(133, 22, 22, 0.649);backdrop-filter: blur(6px);
  }
  .brand{display:flex;gap:12px;align-items:center}
  .logo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
    background: linear-gradient(180deg, rgba(124, 56, 56, 0), rgba(0,0,0,0.06));
    border:1px solid rgba(245, 240, 240, 0.1)}
  .title{font-weight:800;color:var(--red);letter-spacing:0.5px}
  .subtitle{font-size:12px;color:var(--muted);margin-top:-4px}

  .container{max-width:980px;margin:18px auto;padding:14px}

  .card{
    background: linear-gradient(180deg, rgba(60, 22, 22, 0.351), rgba(255,255,255,0.008));
    border-radius:12px;padding:14px;border:1px solid rgba(164, 16, 16, 0.932);margin-bottom:14px;
  }

  .flex{display:flex;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}

  .wallet-row{justify-content:space-between;align-items:center}
  .wallet-balance{font-size:26px;font-weight:900;color:var(--red);text-shadow:0 0 8px rgba(229,59,59,0.06)}

  input[type=number], input[type=text], select{
    background:#1d1d26;border:1px solid rgba(255,255,255,0.04);
    padding:10px;border-radius:8px;color:#dcdcdc;font-size:15px;outline:none;
  }

  .btn{
    border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700;
    transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px) scale(.997)}
  .btn-primary{background:linear-gradient(180deg,var(--red),#c93a3a);color:white;box-shadow:0 10px 26px rgba(229,59,59,0.06)}
  .btn-ghost{background:#1d1d26;color:#ddd;border:3px solid rgba(255,255,255,0.03)}
  .btn-small{padding:8px 10px;font-size:14px}

  .game-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .multiplier{font-size:48px;font-weight:900;color:var(--red);text-shadow:0 6px 18px rgba(229,59,59,0.06)}
  .controls{min-width:220px;display:flex;flex-direction:column;gap:8px}

  .track{
    margin-top:14px;position:relative;height:240px;border-radius:12px;overflow:hidden;
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,0.01), transparent 30%),
      linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.02));
    border:1px solid rgba(255,255,255,0.03);
  }

  .rays{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 10%, rgba(255, 255, 255, 0.01), transparent 20%),
      radial-gradient(ellipse at 50% 90%, rgba(255,255,255,0.01), transparent 25%);
    mix-blend-mode:overlay;opacity:0.55;
  }

  .plane-wrap{
    position:absolute;bottom:16px;left:8px;width:110px;height:72px;z-index:6;pointer-events:none;
    transform-origin:center;transition:transform .06s linear,left .06s linear;will-change:left,transform;
  }

  .trail{position:absolute;left:-60px;bottom:28px;width:140px;height:26px;opacity:0.7;filter: blur(10px);transform-origin:left center;pointer-events:none}

  .smoke{position:absolute;bottom:26px;left:calc(var(--smoke-left, -40px));width:120px;height:60px;opacity:0;pointer-events:none}
  .smoke .p{position:absolute;background: radial-gradient(circle, rgba(90,90,90,0.22), rgba(40,40,40,0.06)); border-radius:50%}

  .hud{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
  .status{font-size:13px;color:var(--muted);margin-top:8px}

  .history-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .hist-pill{background:rgba(3, 0, 0, 0);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:999px;font-weight:600;color:#ddd;font-size:13px}

  /* leaderboard table */
  .leaderboard{width:100%;border-collapse:collapse;margin-top:6px}
  .leaderboard th, .leaderboard td{padding:8px 10px;text-align:left;font-size:14px;border-bottom:1px dashed rgba(255,255,255,0.03)}
  .muted{color:var(--muted);font-size:13px}

  @media (max-width:720px){
    .multiplier{font-size:40px}
    .plane-wrap{width:92px;height:60px}
    .controls{min-width:unset}
    .track{height:200px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" aria-hidden>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12L22 6L12 22L9 13L2 12Z" fill="#e53b3b"/>
      </svg>
    </div>
    <div>
      <div class="title">Aviator</div>
      <div class="subtitle">Crash Flight Engine</div>
    </div>
  </div>

  <div style="display:flex;gap:10px;align-items:center">
    <div style="text-align:right;font-size:13px;color:var(--muted);">
      <div style="font-weight:700" id="playerDisplay">Guest</div>
      <div style="font-size:12px;color:var(--muted)">Player</div>
    </div>
    <button class="btn btn-ghost btn-small" id="helpBtn">How to play</button>
  </div>
</header>

<main class="container">

  <!-- Player + Wallet -->
  <section class="card">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div style="display:flex;gap:12px;align-items:center">
        <div>
          <div style="font-size:13px;color:var(--muted)">Player Name</div>
          <input id="playerName" type="text" placeholder="Enter name (saved)" style="min-width:200px" />
        </div>
        <div>
          <div style="font-size:13px;color:var(--muted)">Wallet</div>
          <div class="wallet-balance">₹ <span id="walletAmount">200.00</span></div>
        </div>
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <a href="https://realayushkumar.github.io/payment-page-/" >
        <button class="btn btn-primary" id="addBtn">Add Cash And Get Bonus</button> </a>
        <button class="btn btn-ghost" id="clearData"> Withdraw </button> 
        
      </div>
    </div>
    <div id="walletMsg" class="status" style="margin-top:10px"></div>
  </section>

  <!-- Game -->
  <section class="card">
    <div class="game-top">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="multiplier" id="multiplier">1.00x</div>
          <div style="color:var(--muted);font-size:13px">Current round</div>
        </div>
        <div class="status" id="status">Ready for takeoff ✈️</div>
      </div>

      <div class="controls">
        <label style="font-size:13px;color:var(--muted)">Bet amount (₹)</label>
        <input id="betAmount" type="number" min="1" value="10" />
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" id="startBtn">Start Flight</button>
          <button class="btn btn-ghost" id="cashoutBtn" disabled>Cash Out</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-ghost btn-small" id="autoBtn">Auto Cashout: Off</button>
          <input id="autoTarget" type="number" min="1.05" step="0.01" value="2.00" style="width:90px" />
        </div>
      </div>
    </div>

    <div class="track" id="track" title="Tap track to cash out (when flight running)">
      <div class="rays" aria-hidden></div>

      <div class="hud" id="hud">
        <div style="font-size:12px;color:var(--muted)">Bet</div>
        <div style="font-weight:800">₹ <span id="hudBet">0.00</span></div>
      </div>

      <svg class="trail" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden>
        <defs>
          <linearGradient id="g1" x1="0" x2="1">
            <stop offset="0" stop-color="rgba(229,59,59,0.14)"></stop>
            <stop offset="1" stop-color="rgba(0,0,0,0.02)"></stop>
          </linearGradient>
        </defs>
        <path d="M0,30 C40,18 80,18 200,10 L200,40 L0,40 Z" fill="url(#g1)"/>
      </svg>

      <div class="smoke" id="smoke">
        <div class="p" style="width:28px;height:28px;left:10px;bottom:8px;opacity:0.7"></div>
        <div class="p" style="width:18px;height:18px;left:34px;bottom:6px;opacity:0.5"></div>
      </div>

      <div class="plane-wrap" id="planeWrap" aria-hidden>
        <svg viewBox="0 0 200 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
          <g transform="translate(0,8)">
            <path d="M20 44 L160 6 L150 54 L190 64 L150 84 L120 70 L45 96 L20 44 Z" fill="#0b0b0b"/>
            <path d="M48 52 L110 36 L98 56 L60 70 Z" fill="#e53b3b"/>
            <path d="M150 6 L162 20 L140 26 Z" fill="#e53b3b"/>
            <ellipse cx="60" cy="48" rx="18" ry="10" fill="#111"/>
            <path d="M20 44 L160 6 L150 54 L190 64 L150 84 L120 70 L45 96 L20 44 Z" fill="none" stroke="rgba(255,255,255,0.02)"/>
          </g>
        </svg>
      </div>
    </div>

    <div id="gameMsg" class="status" style="margin-top:12px"></div>
  </section>

  <!-- History & Leaderboard -->
  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-weight:800">Round History</h3>
      <div style="color:var(--muted);font-size:13px">Last 10 rounds</div>
    </div>
    <div id="historyList" class="history-list"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;margin-bottom:6px">
      <h3 style="margin:0;font-weight:800">Leaderboard</h3>
      <div style="color:var(--muted);font-size:13px">Top wins</div>
    </div>
    <div style="overflow:auto">
      <table class="leaderboard" id="leaderboardTable" aria-live="polite">
        <thead>
          <tr><th>#</th><th>Player</th><th>Win</th><th>Multiplier</th><th>When</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</main>

<script>
/* ============================
   Aviator X — Final with:
   - player name saved in localStorage
   - history saved (last 10 rounds)
   - leaderboard (top wins)
   - WebAudio sounds
   ============================ */

const LS_PLAYER = 'aviator_player';
const LS_HISTORY = 'aviator_history';
const LS_LEADER = 'aviator_leaderboard';
const HISTORY_LIMIT = 10;
const LEADER_LIMIT = 20;

/* DOM */
const playerNameInput = document.getElementById('playerName');
const playerDisplay = document.getElementById('playerDisplay');
const walletEl = document.getElementById('walletAmount');
const addAmount = document.getElementById('addAmount');
const addBtn = document.getElementById('addBtn');
const walletMsg = document.getElementById('walletMsg');
const betEl = document.getElementById('betAmount');
const startBtn = document.getElementById('startBtn');
const cashBtn = document.getElementById('cashoutBtn');
const autoBtn = document.getElementById('autoBtn');
const autoInput = document.getElementById('autoTarget');
const multiplierEl = document.getElementById('multiplier');
const statusEl = document.getElementById('status');
const hudBet = document.getElementById('hudBet');
const planeWrap = document.getElementById('planeWrap');
const track = document.getElementById('track');
const smoke = document.getElementById('smoke');
const historyList = document.getElementById('historyList');
const leaderboardTableBody = document.querySelector('#leaderboardTable tbody');
const clearDataBtn = document.getElementById('clearData');
const helpBtn = document.getElementById('helpBtn');
const gameMsg = document.getElementById('gameMsg');

/* State */
let wallet = 0;
let running = false;
let crashed = false;
let crashPoint = 0;
let startTime = 0;
let currentMultiplier = 1.0;
let betValue = 0;
let raf = null;
let history = [];    // kept in memory & localStorage (trim to HISTORY_LIMIT)
let leaderboard = []; // stored in localStorage (top wins)
let playerName = '';
let autoEnabled = false;
let autoTarget = parseFloat(autoInput.value) || 2.0;

/* Audio */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio(){ if(!audioCtx) audioCtx = new AudioCtx(); }

/* simple ding */
function ding(){ try{ ensureAudio(); const ctx = audioCtx; const o = ctx.createOscillator(); const g = ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(880,ctx.currentTime); g.gain.setValueAtTime(0.12,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.45);}catch(e){} }

/* takeoff sweep */
function takeoff(){ try{ ensureAudio(); const ctx=audioCtx; const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(220,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(1200,ctx.currentTime+0.5); g.gain.setValueAtTime(0.08,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.6);}catch(e){} }

/* crash boom */
function crashSound(){ try{ ensureAudio(); const ctx=audioCtx; const o1=ctx.createOscillator(); const o2=ctx.createOscillator(); const g=ctx.createGain(); o1.type='sine'; o2.type='sine'; o1.frequency.setValueAtTime(120,ctx.currentTime); o2.frequency.setValueAtTime(80,ctx.currentTime); g.gain.setValueAtTime(0.18,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.2); o1.connect(g); o2.connect(g); g.connect(ctx.destination); o1.start(); o2.start(); o1.stop(ctx.currentTime+1.2); o2.stop(ctx.currentTime+1.2);}catch(e){} }

/* Helpers */
const $fmt = n => Number(n).toFixed(2);
function saveLS(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
function loadLS(key, fallback){ try{ const v = localStorage.getItem(key); return v? JSON.parse(v) : fallback; }catch(e){ return fallback; } }

/* Load saved data */
function loadApp(){
  // player
  const p = loadLS(LS_PLAYER, '');
  if(p){ playerName = p; playerNameInput.value = playerName; playerDisplay.innerText = playerName; }
  // history & leaderboard
  history = loadLS(LS_HISTORY, []);
  leaderboard = loadLS(LS_LEADER, []);
  // wallet (optional to persist in future) - start with default wallet variable
  walletEl.innerText = $fmt(wallet);
  renderHistory();
  renderLeaderboard();
}
loadApp();

/* Save functions */
function saveHistory(){ saveLS(LS_HISTORY, history); }
function saveLeader(){ saveLS(LS_LEADER, leaderboard); }
function savePlayer(){ saveLS(LS_PLAYER, playerName); }

/* UI events */
playerNameInput.addEventListener('change', ()=>{
  const v = playerNameInput.value.trim() || 'Guest';
  playerName = v;
  playerDisplay.innerText = playerName;
  savePlayer();
});

addBtn.addEventListener('click', ()=>{
  const v = parseFloat(addAmount.value);
  if(!v || v<=0){ walletMsg.innerText = 'Enter valid amount'; return; }
  wallet += v;
  walletEl.innerText = $fmt(wallet);
  walletMsg.innerText = `₹${$fmt(v)} added`;
  addAmount.value = '';
});

autoBtn.addEventListener('click', ()=>{
  autoEnabled = !autoEnabled;
  autoBtn.innerText = `Auto Cashout: ${autoEnabled? 'On' : 'Off'}`;
  autoBtn.classList.toggle('btn-primary', autoEnabled);
});
autoInput.addEventListener('change', ()=> autoTarget = parseFloat(autoInput.value) || 2.0 );

/* Crash RNG (7x to 50x only) */
function generateCrash(){
    const min = 7;
    const max = 50;
    return Math.random() * (max - min) + min;
}


/* Start flight */
startBtn.addEventListener('click', ()=>{
  if(running) return;
  const bet = parseFloat(betEl.value);
  if(!bet || bet<=0){ statusEl.innerText = 'Invalid bet'; return; }
  if(bet > wallet){ statusEl.innerText = 'Insufficient balance'; return; }

  // Deduct
  wallet -= bet;
  walletEl.innerText = $fmt(wallet);
  betValue = bet;
  hudBet.innerText = $fmt(bet);

  running = true; crashed = false;
  crashPoint = generateCrash();
  startTime = performance.now();
  currentMultiplier = 1.0;

  startBtn.disabled = true; cashBtn.disabled = false;
  statusEl.innerText = 'Flight in air ✈️';
  gameMsg.innerText = '';
  planeWrap.style.left = '8px'; planeWrap.style.transform = 'translateY(0px) rotate(0deg)';
  smoke.style.opacity = 0;
  takeoff();

  raf = requestAnimationFrame(loop);
});

/* Loop */
function loop(ts){
  const elapsed = (ts - startTime)/1000;
  currentMultiplier = Math.exp(elapsed / 2.8);

  multiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';

  const trackWidth = track.clientWidth - planeWrap.clientWidth - 16;
  const progress = Math.min(1, currentMultiplier / crashPoint);
  const easing = Math.pow(progress, 0.95);
  const leftPx = 8 + easing * trackWidth;
  planeWrap.style.left = leftPx + 'px';
  planeWrap.style.transform = `translateY(${ -Math.min(40, Math.log(Math.max(1,currentMultiplier))*8) }px) rotate(${Math.min(18, progress*18)}deg)`;

  const trailEl = document.querySelector('.trail');
  const s = 1 + Math.min(1.4, Math.log(currentMultiplier+1)/2);
  if(trailEl) trailEl.style.transform = `scaleX(${s})`;

  if(autoEnabled && currentMultiplier >= autoTarget && running && !crashed){
    doCashout('auto'); return;
  }
  if(currentMultiplier >= crashPoint){
    doCrash(); return;
  }
  raf = requestAnimationFrame(loop);
}

/* Cashout */
cashBtn.addEventListener('click', ()=> {
  if(!running || crashed) return;
  doCashout('manual');
});

function doCashout(mode){
  if(!running) return;
  const payout = betValue * currentMultiplier;
  wallet += payout;
  walletEl.innerText = $fmt(wallet);

  running = false;
  cancelAnimationFrame(raf);

  statusEl.innerText = `🟢 Cashed out at ${currentMultiplier.toFixed(2)}x — Won ₹${$fmt(payout)}`;
  gameMsg.innerText = `+ ₹${$fmt(payout)} credited`;
  multiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';

  addRoundToHistory('Cashed', currentMultiplier, payout);
  updateLeaderboard(playerName || 'Guest', payout, currentMultiplier);

  cashBtn.disabled = true; startBtn.disabled = false;
  ding();
}

/* Crash */
function doCrash(){
  running = false; crashed = true;
  cancelAnimationFrame(raf);
  multiplierEl.innerText = crashPoint.toFixed(2) + 'x';
  statusEl.innerText = `💥 Crashed at ${crashPoint.toFixed(2)}x`;
  gameMsg.innerText = 'Better luck next time';

  // shake & smoke
  const el = planeWrap;
  let t0 = performance.now(), elapsed = 0;
  const shakeDur = 900;
  function shakeyn(now){
    elapsed = now - t0;
    const pct = elapsed / shakeDur;
    if(pct < 1){
      const amp = 6 * (1 - pct);
      el.style.transform = `translateY(-8px) rotate(${(Math.sin(now/30)*amp)}deg)`;
      smoke.style.opacity = Math.min(1, pct*1.2);
      requestAnimationFrame(shakeyn);
    } else {
      el.style.transform = 'translateY(0px) rotate(0deg)';
      smoke.style.opacity = 0;
    }
  }
  requestAnimationFrame(shakeyn);
  smoke.style.setProperty('--smoke-left', (Math.random()*40 - 20) + 'px');
  crashSound();

  addRoundToHistory('Crashed', crashPoint, 0);
  cashBtn.disabled = true; startBtn.disabled = false;
}

/* History & Leaderboard management */
function addRoundToHistory(type, mult, payout){
  const entry = {type, mult: Number(mult), payout: Number(payout), time: new Date().toISOString(), player: playerName || 'Guest'};
  history.unshift(entry);
  // trim to last HISTORY_LIMIT
  history = history.slice(0, HISTORY_LIMIT);
  saveHistory();
  renderHistory();
}

function updateLeaderboard(name, winAmount, mult){
  if(!winAmount || winAmount <= 0) return;
  leaderboard.push({player: name || 'Guest', win: Number(winAmount), mult: Number(mult), time: new Date().toISOString()});
  leaderboard.sort((a,b)=> b.win - a.win);
  leaderboard = leaderboard.slice(0, LEADER_LIMIT);
  saveLeader();
  renderLeaderboard();
}

function renderHistory(){
  historyList.innerHTML = '';
  if(!history.length){
    historyList.innerHTML = '<div class="muted">No rounds yet</div>';
    return;
  }
  history.forEach(h=>{
    const pill = document.createElement('div');
    pill.className = 'hist-pill';
    pill.style.border = h.type==='Crashed' ? '1px solid rgba(255,255,255,0.03)' : '1px solid rgba(229,59,59,0.12)';
    pill.style.background = h.type==='Crashed' ? 'rgba(255,255,255,0.015)' : 'linear-gradient(180deg, rgba(229,59,59,0.04), rgba(0,0,0,0.02))';
    const when = new Date(h.time).toLocaleTimeString();
    pill.innerHTML = `<div style="font-size:12px">${h.type}</div>
                      <div style="font-weight:800">${h.mult.toFixed(2)}x</div>
                      <div style="font-size:12px;color:var(--muted)">₹${$fmt(h.payout)} • ${when} • ${h.player}</div>`;
    historyList.appendChild(pill);
  });
}

function renderLeaderboard(){
  leaderboardTableBody.innerHTML = '';
  if(!leaderboard.length){
    leaderboardTableBody.innerHTML = '<tr><td colspan="5" class="muted">No wins yet</td></tr>';
    return;
  }
  leaderboard.forEach((row, i)=>{
    const tr = document.createElement('tr');
    const when = new Date(row.time).toLocaleString();
    tr.innerHTML = `<td>${i+1}</td><td>${escapeHtml(row.player)}</td><td>₹${$fmt(row.win)}</td><td>${row.mult.toFixed(2)}x</td><td class="muted">${when}</td>`;
    leaderboardTableBody.appendChild(tr);
  });
}

/* Save & Clear Data */
clearDataBtn.addEventListener('click', ()=>{
  if(!confirm('Clear saved player, history and leaderboard?')) return;
  localStorage.removeItem(LS_PLAYER);
  localStorage.removeItem(LS_HISTORY);
  localStorage.removeItem(LS_LEADER);
  playerName = '';
  playerNameInput.value = '';
  playerDisplay.innerText = 'Guest';
  history = [];
  leaderboard = [];
  saveHistory(); saveLeader(); savePlayer();
  renderHistory(); renderLeaderboard();
});

/* small helpers */
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

/* Click track to cash out quickly (when running) */
track.addEventListener('click', ()=> { if(running && !crashed) doCashout('tap'); });

/* Prevent form submit on Enter */
document.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); return false; } });

/* On load: show persisted history & leaderboard */
(function initFromLS(){
  history = loadLS(LS_HISTORY, []);
  leaderboard = loadLS(LS_LEADER, []);
  renderHistory(); renderLeaderboard();
})();

/* Demo seed data if empty (keeps UI informative) */
if(history.length === 0){
  addRoundToHistory('Crashed', 1.42, 0);
  addRoundToHistory('Cashed', 2.10, 21.00);
  addRoundToHistory('Crashed', 1.05, 0);
}
if(leaderboard.length === 0){
  updateLeaderboard('Alex', 120.00, 3.00);
  updateLeaderboard('Sam', 85.50, 2.50);
}

/* "How to play" */
helpBtn.addEventListener('click', ()=> {
  alert("Aviator X — How to play:\\n1) Enter player name and add money.\\n2) Place a bet and press Start Flight.\\n3) Multiplier rises — click Cash Out before plane crashes.\\n4) Your win (bet × multiplier) is saved to leaderboard and history.\\nHistory keeps the last 10 rounds.");
});

/* Unlock audio on first gesture */
['click','touchstart'].forEach(evt=>{
  window.addEventListener(evt, function once(){
    try{ ensureAudio(); }catch(e){}
    window.removeEventListener(evt, once);
  }, {passive:true});
});
